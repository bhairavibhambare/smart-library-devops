<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Library Management Platform</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #1f2937;
    }
    header {
      background: #17365d;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }
    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 8px #00000012;
    }
    .card h2 {
      margin-top: 0;
      color: #17365d;
    }
    .status {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 24px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Smart Library Management Platform</h1>
    <p>Cloud-Based Library Services Dashboard</p>
  </header>
  <main>
    <h2>Library Overview</h2>
    <div class="cards">
      <section class="card">
        <h2>Books</h2>
        <p>Digital catalogue management</p>
      </section>
      <section class="card">
        <h2>Members</h2>
        <p>Library membership services</p>
      </section>
      <section class="card">
        <h2>Deployment</h2>
        <p class="status">Application Ready</p>
      </section>
    </div>
  </main>
  <footer>Smart Library DevOps Project | AWS • Terraform • Ansible • Docker</footer>
</body>
</html>
